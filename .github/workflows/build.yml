name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with official Kivy Docker image
        run: |
          set -o pipefail
          yes | docker run --rm -i -v ${{ github.workspace }}:/home/user/hostcwd kivy/buildozer android debug 2>&1 | tee build_log.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
